<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CHI AUTO - Авто из Китая, Японии, Кореи{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                CHI AUTO
            </div>
            <div class="slogan">Авто под заказ из Китая, Японии, Кореи</div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer Navigation -->
    <nav class="footer-nav">
        <button class="nav-item {% if request.endpoint == 'index' %}active{% endif %}" onclick="window.location.href='/'">
            <div class="nav-icon-wrapper">
                <!-- Иконка дома -->
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 20V14H14V20H19V12H22L12 3L2 12H5V20H10Z" fill="currentColor"/>
                </svg>
            </div>
            <span class="nav-text">Главная</span>
        </button>

        <button class="nav-item {% if request.endpoint == 'in_stock' %}active{% endif %}" onclick="window.location.href='/in-stock'">
            <div class="nav-icon-wrapper">
                <!-- Иконка автомобиля -->
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5H6.5C5.84 5 5.29 5.42 5.08 6.01L3 12V20C3 20.55 3.45 21 4 21H5C5.55 21 6 20.55 6 20V19H18V20C18 20.55 18.45 21 19 21H20C20.55 21 21 20.55 21 20V12L18.92 6.01ZM6.5 16C5.67 16 5 15.33 5 14.5C5 13.67 5.67 13 6.5 13C7.33 13 8 13.67 8 14.5C8 15.33 7.33 16 6.5 16ZM17.5 16C16.67 16 16 15.33 16 14.5C16 13.67 16.67 13 17.5 13C18.33 13 19 13.67 19 14.5C19 15.33 18.33 16 17.5 16ZM5 11L6.5 6.5H17.5L19 11H5Z" fill="currentColor"/>
                </svg>
            </div>
            <span class="nav-text">Авто</span>
        </button>

        <button class="nav-item" onclick="showSection('cities')">
            <div class="nav-icon-wrapper">
                <!-- Иконка городов -->
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 11V5L12 2L9 5V7H3V21H21V11H15ZM5 19H7V17H5V19ZM5 15H7V13H5V15ZM5 11H7V9H5V11ZM9 19H11V17H9V19ZM9 15H11V13H9V15ZM9 11H11V9H9V11ZM9 7H11V5H9V7ZM13 19H15V17H13V19ZM13 15H15V13H13V15ZM13 11H15V9H13V11ZM13 7H15V5H13V7ZM17 19H19V17H17V19ZM17 15H19V13H17V15Z" fill="currentColor"/>
                </svg>
            </div>
            <span class="nav-text">Города</span>
        </button>

        <!-- КНОПКА СЕРВИС -->
        <button class="nav-item {% if request.endpoint == 'service' %}active{% endif %}" onclick="window.location.href='/service'">
            <div class="nav-icon-wrapper">
                <!-- Иконка сервиса -->
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 8L15 12H18C18 15.31 15.31 18 12 18C10.99 18 10.03 17.75 9.2 17.3L7.74 18.76C9.03 19.54 10.43 20 12 20C16.42 20 20 16.42 20 12H23L19 8ZM6 12C6 8.69 8.69 6 12 6C13.01 6 13.97 6.25 14.8 6.7L16.26 5.24C14.97 4.46 13.57 4 12 4C7.58 4 4 7.58 4 12H1L5 16L9 12H6Z" fill="currentColor"/>
                </svg>
            </div>
            <span class="nav-text">Сервис</span>
        </button>

        <!-- КНОПКА FAQ -->
        <button class="nav-item {% if request.endpoint == 'faq' %}active{% endif %}" onclick="window.location.href='/faq'">
            <div class="nav-icon-wrapper">
                <!-- Иконка FAQ -->
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM13 19H11V17H13V19ZM15.07 11.25L14.17 12.17C13.45 12.9 13 13.5 13 15H11V14.5C11 13.4 11.45 12.4 12.17 11.67L13.41 10.41C13.78 10.05 14 9.55 14 9C14 7.9 13.1 7 12 7C10.9 7 10 7.9 10 9H8C8 6.79 9.79 5 12 5C14.21 5 16 6.79 16 9C16 9.88 15.64 10.68 15.07 11.25Z" fill="currentColor"/>
                </svg>
            </div>
            <span class="nav-text">FAQ</span>
        </button>

        <button class="nav-item {% if request.endpoint == 'contacts' %}active{% endif %}" onclick="window.location.href='/contacts'">
            <div class="nav-icon-wrapper">
                <!-- Иконка контактов -->
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 4H4C2.9 4 2.01 4.9 2.01 6L2 18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V6C22 4.9 21.1 4 20 4ZM20 8L12 13L4 8V6L12 11L20 6V8Z" fill="currentColor"/>
                </svg>
            </div>
            <span class="nav-text">Контакты</span>
        </button>
    </nav>

    <!-- Модальное окно выбора города -->
    <div id="citiesModal" class="cities-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Выберите город</h3>
                <button class="close-modal" onclick="closeCitiesModal()">×</button>
            </div>
            <div class="cities-list">
                {% for city_id, city in cities.items() %}
                <button class="city-option" onclick="selectCity('{{ city_id }}', '{{ city.name|urlencode }}', '{{ city.address|urlencode }}', '{{ city.phone }}', '{{ city.email }}', '{{ city.working_hours|urlencode }}', '{{ city.description|urlencode }}')">
                    {{ city.name }}
                </button>
                {% endfor %}
            </div>
        </div>
    </div>

    {% block scripts %}
    <script>
        function showSection(sectionName) {
            // Убрать активный класс со всех кнопок
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });

            // Активировать нажатую кнопку
            event.target.closest('.nav-item').classList.add('active');

            if (sectionName === 'cities') {
                showCitiesModal();
            } else if (sectionName === 'contacts') {
                window.location.href = '/contacts';
            } else if (sectionName === 'faq') {
                window.location.href = '/faq';
            } else if (sectionName === 'service') {
                window.location.href = '/service';
            }
            console.log('Переключение на раздел:', sectionName);
        }

        // Функции для работы с модальным окном городов
        function showCitiesModal() {
            document.getElementById('citiesModal').style.display = 'flex';
        }

        function closeCitiesModal() {
            document.getElementById('citiesModal').style.display = 'none';
        }

        function selectCity(cityId, cityName, cityAddress, cityPhone, cityEmail, cityWorkingHours, cityDescription) {
            // Декодируем URL-encoded строки
            const decodedName = decodeURIComponent(cityName);
            const decodedAddress = decodeURIComponent(cityAddress);
            const decodedWorkingHours = decodeURIComponent(cityWorkingHours);
            const decodedDescription = decodeURIComponent(cityDescription);

            // Создаем HTML с информацией о городе
            const cityInfoHTML = `
                <div class="city-info-modal">
                    <h3>${decodedName}</h3>
                    <div class="city-description">${decodedDescription}</div>
                    <div class="city-details">
                        <div class="city-detail-item">
                            <span class="detail-icon">📍</span>
                            <span class="detail-text">${decodedAddress}</span>
                        </div>
                        <div class="city-detail-item">
                            <span class="detail-icon">🕒</span>
                            <span class="detail-text">${decodedWorkingHours}</span>
                        </div>
                        <div class="city-detail-item">
                            <span class="detail-icon">📞</span>
                            <span class="detail-text">${cityPhone}</span>
                        </div>
                        <div class="city-detail-item">
                            <span class="detail-icon">✉️</span>
                            <span class="detail-text">${cityEmail}</span>
                        </div>
                    </div>
                    <div class="city-actions">
                        <button class="btn-primary" onclick="window.location.href='/'">Посмотреть авто</button>
                        <button class="btn-secondary" onclick="showOnMap('${decodedName}')">Показать на карте</button>
                        <button class="btn-call" onclick="callNumber('${cityPhone}')">
                            <span class="btn-icon">📞</span>
                            Позвонить
                        </button>
                    </div>
                </div>
            `;

            // Показываем модальное окно с информацией о городе
            showCityInfoModal(cityInfoHTML);
            closeCitiesModal();
        }

        function showCityInfoModal(contentHTML) {
            // Создаем модальное окно для информации о городе
            const modal = document.createElement('div');
            modal.className = 'cities-modal';
            modal.id = 'cityInfoModal';
            modal.style.display = 'flex';
            modal.innerHTML = `
                <div class="modal-content city-info-content">
                    <div class="modal-header">
                        <h3 class="modal-title">Информация о салоне</h3>
                        <button class="close-modal" onclick="closeCityInfoModal()">×</button>
                    </div>
                    <div class="modal-body">
                        ${contentHTML}
                    </div>
                </div>
            `;

            document.body.appendChild(modal);

            // Закрытие при клике вне окна
            modal.addEventListener('click', function(event) {
                if (event.target === modal) {
                    closeCityInfoModal();
                }
            });
        }

        function closeCityInfoModal() {
            const modal = document.getElementById('cityInfoModal');
            if (modal) {
                modal.remove();
            }
        }

        function showOnMap(cityName) {
            // Интеграция с Яндекс.Картами
            const query = encodeURIComponent(cityName + ' CHI AUTO');
            window.open(`https://yandex.ru/maps/?text=${query}`, '_blank');
        }

        function callNumber(phoneNumber) {
            // Очищаем номер от лишних символов
            const cleanNumber = phoneNumber.replace(/[^\d+]/g, '');
            window.location.href = `tel:${cleanNumber}`;
        }

        // Анимация появления карточек
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.car-card');
            cards.forEach((card, index) => {
                card.style.animationDelay = `${index * 0.1}s`;
                card.classList.add('animate-in');
            });

            // Закрытие модального окна при клике вне его
            const modal = document.getElementById('citiesModal');
            if (modal) {
                modal.addEventListener('click', function(event) {
                    if (event.target === modal) {
                        closeCitiesModal();
                    }
                });
            }

            // Автоматическое обновление активного состояния кнопок
            updateActiveNav();

            // Настройка стилей для SVG иконок
            setupSVGIcons();
        });

        // Функция для обновления активного состояния кнопок
        function updateActiveNav() {
            const currentPath = window.location.pathname;
            const navItems = document.querySelectorAll('.nav-item');

            navItems.forEach(item => {
                item.classList.remove('active');

                // Проверяем, соответствует ли путь кнопки текущему пути
                const onclick = item.getAttribute('onclick');
                if (onclick) {
                    if (onclick.includes("'/") && onclick.includes("'")) {
                        const urlStart = onclick.indexOf("'") + 1;
                        const urlEnd = onclick.indexOf("'", urlStart);
                        const buttonUrl = onclick.substring(urlStart, urlEnd);

                        if (currentPath === buttonUrl ||
                            (buttonUrl === '/' && currentPath === '') ||
                            (currentPath.startsWith(buttonUrl) && buttonUrl !== '/')) {
                            item.classList.add('active');
                        }
                    }
                }
            });
        }

        // Функция для настройки цветов SVG иконок
        function setupSVGIcons() {
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                const icon = item.querySelector('.nav-icon');
                if (icon) {
                    // Установка начального цвета
                    if (item.classList.contains('active')) {
                        icon.style.color = '#ffffff';
                    } else {
                        icon.style.color = '#b0bec5';
                    }

                    // Добавление обработчика для hover
                    item.addEventListener('mouseenter', () => {
                        if (!item.classList.contains('active')) {
                            icon.style.color = '#ffd700';
                        }
                    });

                    item.addEventListener('mouseleave', () => {
                        if (!item.classList.contains('active')) {
                            icon.style.color = '#b0bec5';
                        }
                    });
                }
            });
        }

        // Обновление цветов иконок при смене активного состояния
        document.addEventListener('click', function(e) {
            if (e.target.closest('.nav-item')) {
                setTimeout(() => {
                    setupSVGIcons();
                }, 10);
            }
        });
    </script>
    {% endblock %}

    <style>
        /* Модальное окно выбора города */
        .cities-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(30, 35, 75, 0.95) 0%, rgba(20, 25, 55, 0.95) 100%);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .city-info-content {
            max-width: 600px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-title {
            color: #ffd700;
            font-size: 24px;
            margin: 0;
        }

        .close-modal {
            background: none;
            border: none;
            color: #b0bec5;
            font-size: 24px;
            cursor: pointer;
            transition: color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
        }

        .close-modal:hover {
            color: #ffd700;
        }

        .cities-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .city-option {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px 20px;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            border: none;
            font-size: 16px;
        }

        .city-option:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 215, 0, 0.3);
            transform: translateX(5px);
        }

        /* Стили для модального окна с информацией о городе */
        .city-info-modal {
            padding: 10px 0;
        }

        .city-info-modal h3 {
            color: #ffd700;
            margin-bottom: 10px;
            text-align: center;
            font-size: 24px;
        }

        .city-description {
            color: #b0bec5;
            text-align: center;
            margin-bottom: 20px;
            font-style: italic;
            font-size: 14px;
        }

        .city-details {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .city-detail-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            color: #ffffff;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-icon {
            color: #ffd700;
            font-size: 16px;
            min-width: 20px;
            text-align: center;
        }

        .detail-text {
            color: #ffffff;
            line-height: 1.4;
            flex: 1;
        }

        .city-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .city-actions .btn-primary,
        .city-actions .btn-secondary,
        .city-actions .btn-call {
            padding: 15px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
        }

        .city-actions .btn-primary {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #0a0f2d;
        }

        .city-actions .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .city-actions .btn-call {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: #ffffff;
        }

        .city-actions .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        .city-actions .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .city-actions .btn-call:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .modal-body {
            max-height: 60vh;
            overflow-y: auto;
        }

        .btn-icon {
            font-size: 16px;
        }

        /* Стили для SVG иконок */
        .nav-icon {
            width: 20px;
            height: 20px;
            transition: all 0.3s ease;
        }

        .nav-item:not(.active) .nav-icon {
            color: #b0bec5;
        }

        .nav-item.active .nav-icon {
            color: #ffffff;
        }

        .nav-item:hover:not(.active) .nav-icon {
            color: #ffd700;
        }

        @media (max-width: 768px) {
            .modal-content {
                padding: 20px;
                margin: 20px;
            }

            .modal-title {
                font-size: 20px;
            }

            .city-option {
                padding: 12px 16px;
                font-size: 14px;
            }

            .city-info-modal h3 {
                font-size: 20px;
            }

            .city-detail-item {
                padding: 8px;
            }

            .city-actions .btn-primary,
            .city-actions .btn-secondary,
            .city-actions .btn-call {
                padding: 12px 16px;
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            .modal-content {
                padding: 15px;
            }

            .modal-title {
                font-size: 18px;
            }

            .city-info-content {
                width: 95%;
            }
        }
    </style>
</body>
</html>
